[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicemem"
version = "0.2.3"
description = "Left-brain/right-brain memory framework with an audio-native perception layer (scene/speaker/emotion)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Lang Jiaqi" }]
keywords = ["memory", "voice", "agent", "llm", "speech", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# `pip install voicemem` installs all built-in components: ASR, VAD, speaker ID, scene, emotion,
# local embeddings, plus the web demo and examples runtime dependencies.
#
# These dependencies used to live under the [slm] extra. After installing the base package,
# users could still hit ModuleNotFoundError: funasr because ASR was unexpectedly hidden in [slm].
dependencies = [
    "numpy",
    "openai",
    "mem0ai",
    # -- Audio pipeline --
    "torch",
    "torchaudio",         # imported by FunASR but not declared by it
    "torchvision",        # transformers needs Qwen2VLVideoProcessor when loading Qwen2.5-Omni,
                          # which imports torchvision. Without it there may be no error; the emotion attribution layer silently
                          # falls back to an acoustic-only path, making the right-brain emotion attribution unreliable.
    "transformers==4.52.3",
    "accelerate",         # 情绪归因 from_pretrained(device_map="auto") 要它，
                          # 缺了同样是静默退化，不是报错。
    "funasr",             # streaming ASR (default)
    "modelscope",         # used by FunASR for model downloads
    "sherpa-onnx",        # VAD + speaker ID + fallback ASR (ONNX only)
    "sentence-transformers",   # local E5 (memory embeddings / slot classification)
    "soundfile",          # reads mp3/m4a/flac; without it the standard-library wave reader only supports PCM WAV
    "scipy",
    # -- web demo (web/run.py) and examples --
    "fastapi",
    "uvicorn",
    "pydantic",           # web/utils.py 顶层就 import 了（fastapi 带得进来，但别靠它）
    "websockets>=14",     # uvicorn 跑 WebSocket；examples/05 接 realtime 也用
    "sounddevice",        # examples 里的语音 agent：麦克风 + 扬声器
    "pywebrtc-audio",     # echo cancellation (helps prevent speaker playback from triggering barge-in)
]

[project.optional-dependencies]
rtc = [
    "av>=14",
]

# Runs the fine-tuned Qwen reply model (Qwen3.6-35B-A3B + QLoRA adapter).
# Weights are not included in the wheel; download them with `bash scripts/download_models.sh --reply-adapter`.
slm = [
    "peft",               # 加载 QLoRA adapter
    "qwen-omni-utils",    # Qwen-Omni 的多模态输入预处理
    "audioread",          # qwen-omni-utils 顶层就 import 它，但自己没声明；
                          # 缺了 `import qwen_omni_utils` 直接 ModuleNotFoundError。
]

# 只有这两条命令。其余场景各自 pip，不再单开 extra——名字对不上内容的 extra
# 正是之前那个坑的成因（[slm] 里装着 ASR，谁也想不到）：
#   本地 TTS（TTS_BACKEND=local）  pip install piper-tts   或   pip install voxcpm
#   跑 finetune/ 的训练脚本         pip install ms-swift==4.5.2 bitsandbytes

[project.urls]
Homepage = "https://github.com/lang-jiaqi/Voicemem_open"
Repository = "https://github.com/lang-jiaqi/Voicemem_open"
Issues = "https://github.com/lang-jiaqi/Voicemem_open/issues"

[tool.setuptools.packages.find]
include = ["voicemem*"]

# Prompt text under data/ is read at runtime (see leftbrain/mem0_additive_prompt_build.py);
# without declaring it as package data, the wheel will not contain it and runtime calls will fail with FileNotFoundError.
[tool.setuptools.package-data]
# Prompt text under data/ is read at runtime (see leftbrain/mem0_additive_prompt_build.py);
# without declaring it as package data, the wheel will not contain it and runtime calls will fail with FileNotFoundError.
#
# assets/*.wav contains example audio used by the README and examples (about 1 MB). Without it,
# the first example after pip installation can fail with LibsndfileError, which is a poor first impression.
# voicemem.sample_audio() first checks the repository assets and falls back to the packaged copy.
"*" = ["data/*.txt", "*.txt", "assets/*.wav"]

name: Production checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  python:
    runs-on: ubuntu-latest
    # A real Postgres, because accounts and backups must work on the database used in production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: voicemem_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/voicemem_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # The tests only need the web layer, not torch or the models, so this stays fast.
      - name: Install test tooling
        run: |
          pip install numpy fastapi uvicorn pydantic httpx pytest ruff sqlalchemy "psycopg[binary]" openai soundfile scipy
          pip install --no-deps -e .
      - run: ruff check .
      - run: python -m pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      # Fails on any vulnerable pin except the dated ones in security/audit-exceptions.txt.
      - run: |
          pip-audit -r requirements.lock --no-deps --disable-pip -f json > audit.json || true
          python scripts/audit_gate.py < audit.json

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, python]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # CPU-only torch keeps the CI image small; production can build with the default index.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
          cache-from: type=gha
          cache-to: type=gha,mode=max

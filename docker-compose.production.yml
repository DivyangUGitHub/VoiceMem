services:
  voicemem:
    build:
      context: .
      dockerfile: Dockerfile
      # args:
      #   TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu   # CPU-only torch: far smaller image
    # Bind to localhost: put a TLS-terminating reverse proxy (Caddy, nginx, a cloud LB) in front.
    # If that proxy is on another host, publish "8787:10000" and set FORWARDED_ALLOW_IPS to its address.
    ports:
      - "127.0.0.1:8787:10000"
    env_file:
      - .env.production
    volumes:
      - voicemem-data:/var/lib/voicemem
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  voicemem-data:
